name: Regression checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: override
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: override
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: home-assistant/core
          ref: 2026.1.3
          path: core
          sparse-checkout: homeassistant/components/webostv
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install homeassistant==2026.1.3 aiowebostv==0.9.2 async-upnp-client==0.46.1
      - run: python test_exact_override.py ../core/homeassistant/components/webostv
      - run: python tests/test_connection.py .
      - run: python tests/test_ssdp.py .
